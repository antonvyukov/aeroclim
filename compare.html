<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Сравнение — AeroClim</title><script src="https://cdn.tailwindcss.com"></script><script src="assets/tailwind-config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script><script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script><link rel="stylesheet" href="assets/site.css" /></head>
<body class="font-sans text-ink antialiased leading-body" x-data="store()"><div class="grain" aria-hidden="true"></div><header class="surface-floating sticky top-0 z-[40] border-b border-line/80 bg-white/90 backdrop-blur-md"><div class="page-x mx-auto flex max-w-6xl items-center justify-between gap-item py-item"><a href="index.html" class="font-display text-2xl font-semibold tracking-display">AeroClim</a><nav class="hidden items-center gap-card text-sm font-medium text-mist md:flex"><a href="index.html#catalog">Каталог</a><a href="about.html">О магазине</a><a href="delivery.html">Доставка</a><a href="contacts.html">Контакты</a></nav><div class="header-actions flex items-center gap-tight"><a href="favorites.html" class="header-action"><span class="header-action-icon"><iconify-icon icon="solar:heart-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-show="favoriteCount" x-text="favoriteCount"></span></span><span>Избранное</span></a><a href="compare.html" class="header-action"><span class="header-action-icon"><iconify-icon icon="solar:sort-horizontal-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-show="compareCount" x-text="compareCount"></span></span><span>Сравнить</span></a><a href="cart.html" class="header-cart" aria-label="Корзина"><iconify-icon icon="solar:cart-large-2-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-text="cartCount"></span></a></div></div></header>
<main class="page-x section-y mx-auto max-w-6xl"><p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky">Характеристики</p><div class="mt-item flex flex-wrap items-end justify-between gap-item"><div><h1 class="font-display text-4xl font-semibold">Сравнение кондиционеров</h1><p class="mt-tight text-mist">До четырёх моделей рядом, чтобы выбрать уверенно.</p></div><button type="button" class="rounded-full border border-line px-item py-tight text-sm text-mist" x-show="compareProducts.length" @click="compare = []; persistLists()">Очистить сравнение</button></div>
<div x-show="!compareProducts.length" class="mt-block rounded-2xl border border-dashed border-line px-card py-section text-center text-mist">Добавьте модели из каталога в сравнение. <a href="index.html#catalog" class="text-sky">Открыть каталог</a></div>
<div x-show="compareProducts.length" class="mt-block overflow-x-auto rounded-2xl border border-line/80 bg-white"><table class="w-full min-w-[720px] border-collapse text-sm"><thead><tr><th class="w-44 border-b border-r border-line bg-frost p-item text-left font-medium text-mist">Параметр</th><template x-for="p in compareProducts" :key="'head-'+p.id"><th class="min-w-[180px] border-b border-line bg-white p-item text-left align-top"><div class="flex min-h-[218px] flex-col"><a :href="productHref(p)" class="block"><img :src="p.img" :alt="p.name" class="mb-tight h-28 w-full bg-white object-contain"><span class="block font-medium" x-text="p.name"></span></a><button type="button" class="mt-auto text-left text-xs text-mist" @click="toggleCompare(p)">Убрать</button></div></th></template></tr></thead><tbody><template x-for="row in comparisonRows" :key="row[0]"><tr class="border-b border-line last:border-0"><th class="spec-tip border-r border-line bg-frost/60 p-item text-left font-medium text-mist" :data-tip="specTip(row[0])" tabindex="0" :aria-label="row[0] + ': ' + specTip(row[0])"><span x-text="row[0]"></span><iconify-icon class="spec-tip-icon" icon="solar:info-circle-linear" width="14" height="14" aria-hidden="true"></iconify-icon></th><template x-for="value in row[1]" :key="row[0] + value"><td class="p-item align-top" x-text="value"></td></template></tr></template></tbody></table></div></main><script src="assets/layout.js"></script><script src="assets/store.js"></script></body></html>
