<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Избранное — AeroClim</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="assets/tailwind-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script><script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body class="font-sans text-ink antialiased leading-body" x-data="store()"><div class="grain" aria-hidden="true"></div>
  <header class="surface-floating sticky top-0 z-[40] border-b border-line/80 bg-white/90 backdrop-blur-md"><div class="page-x mx-auto flex max-w-6xl items-center justify-between gap-item py-item">
    <a href="index.html" class="flex shrink-0 flex-col leading-none"><span class="font-display text-2xl font-semibold tracking-display">AeroClim</span><span class="mt-1 text-[9px] uppercase tracking-[0.18em] text-mist">климатическая техника</span></a>
    <nav class="hidden items-center gap-card text-sm font-medium text-mist md:flex"><a href="index.html#catalog">Каталог</a><div class="relative" @mouseenter="aboutOpen = true" @mouseleave="aboutOpen = false"><a href="about.html" class="nav-keep inline-flex items-center gap-1">О магазине <span aria-hidden="true">▾</span></a><div class="absolute left-0 top-full z-[50] pt-tight" x-show="aboutOpen" x-cloak><div class="nav-drop min-w-[190px] rounded-2xl border border-line/80 bg-white p-tight shadow-floating"><a href="about.html" class="block rounded-xl px-item py-tight">О магазине</a><a href="works.html" class="block rounded-xl px-item py-tight text-ink">Наши работы</a></div></div></div><a href="delivery.html">Доставка</a><a href="contacts.html">Контакты</a></nav>
    <div class="header-actions flex items-center gap-tight"><a href="favorites.html" class="header-action"><span class="header-action-icon"><iconify-icon icon="solar:heart-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-show="favoriteCount" x-text="favoriteCount"></span></span><span>Избранное</span></a><a href="compare.html" class="header-action"><span class="header-action-icon"><iconify-icon icon="solar:sort-horizontal-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-show="compareCount" x-text="compareCount"></span></span><span>Сравнить</span></a><a href="cart.html" class="header-cart" aria-label="Корзина"><iconify-icon icon="solar:cart-large-2-linear" width="21" height="21"></iconify-icon><span class="header-action-count" x-text="cartCount"></span></a></div>
  </div></header>
  <main class="page-x section-y mx-auto max-w-6xl"><p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky">Личный список</p><div class="mt-item flex flex-wrap items-end justify-between gap-item"><div><h1 class="font-display text-4xl font-semibold">Избранное</h1><p class="mt-tight text-mist">Модели, к которым хочется вернуться.</p></div><button type="button" class="rounded-full border border-line px-item py-tight text-sm text-mist" x-show="favoriteProducts.length" @click="favorites = []; persistLists()">Очистить список</button></div>
    <div x-show="!favoriteProducts.length" class="mt-block rounded-2xl border border-dashed border-line px-card py-section text-center text-mist">В избранном пока нет товаров. <a href="index.html#catalog" class="text-sky">Перейти в каталог</a></div>
    <div class="mt-block grid gap-item sm:grid-cols-2 lg:grid-cols-3"><template x-for="p in favoriteProducts" :key="p.id"><article class="relative overflow-hidden rounded-2xl border border-line/80 bg-white"><label class="absolute left-3 top-3 z-10 flex items-center gap-tight rounded-full bg-white/90 px-tight py-1 text-xs shadow-sm"><input type="checkbox" :value="p.id" x-model="selectedFavorites" /> Выбрать</label><a :href="productHref(p)" class="block aspect-[4/3] bg-white"><img :src="p.img" :alt="p.name" class="h-full w-full object-contain p-item"></a><div class="p-card"><p class="text-xs uppercase text-mist" x-text="p.brand"></p><a :href="productHref(p)" class="mt-tight block font-medium" x-text="p.name"></a><p class="mt-item font-semibold" x-text="formatPrice(p.price)"></p><div class="mt-item flex flex-wrap gap-tight"><button type="button" class="btn rounded-full bg-sky px-item py-tight text-sm font-medium text-white" @click="addToCart(p)">В корзину</button><button type="button" class="rounded-full border border-line px-item py-tight text-sm" @click="toggleFavorite(p)">Убрать</button></div></div></article></template></div>
    <div x-show="favoriteProducts.length" class="mt-card rounded-2xl bg-frost p-card"><div class="flex flex-wrap items-center justify-between gap-item"><span class="font-medium" x-text="selectedFavorites.length ? 'Выбрано: ' + selectedFavorites.length : 'Выберите несколько товаров'"></span><div class="flex flex-wrap gap-tight"><button type="button" class="rounded-full border border-line px-item py-tight text-sm" :class="selectedFavorites.length ? '' : 'pointer-events-none opacity-40'" @click="removeSelectedFavorites">Удалить выбранные</button><button type="button" class="btn rounded-full bg-ink px-card py-item text-sm font-medium text-white" :class="selectedFavorites.length ? '' : 'pointer-events-none opacity-40'" @click="transferSelectedFavorites">Перенести в корзину</button></div></div></div>
  </main><script src="assets/store.js"></script>
</body></html>
